<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết căn hộ — S.Sens Homes</title>
  <meta name="description" content="Thông tin, hình ảnh, tiện nghi và quy định của căn hộ S.Sens Homes." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div data-header="index.html"></div>

  <main class="wrap detail-top" id="detail-root">
    <!-- populated by JS -->
    <div class="empty" style="padding:120px 0">
      <h3>Loading stay…</h3>
    </div>
  </main>

  <section class="section" style="padding-top:64px">
    <div class="wrap">
      <div class="cta-band reveal">
        <div class="eyebrow" style="color:#e7c99b">More to explore</div>
          <h2>Xem tất cả căn hộ.</h2>
          <p>Mỗi không gian S.Sens đều được thiết kế riêng và chăm sóc bởi đội ngũ địa phương.</p>
          <a href="index.html#listing" class="btn btn-tan">Quay lại danh sách căn hộ</a>
      </div>
    </div>
  </section>

  <div data-footer></div>

  <!-- Fullscreen lightbox (docs spec: "xem toàn màn hình") -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Xem ảnh">
    <button class="lb-close" data-lb-close aria-label="Đóng">✕</button>
    <button class="lb-nav lb-prev" data-lb-prev aria-label="Ảnh trước">‹</button>
    <img id="lightbox-img" src="" alt="Ảnh căn hộ" />
    <button class="lb-nav lb-next" data-lb-next aria-label="Ảnh tiếp theo">›</button>
    <div class="lb-count" id="lightbox-count"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/booking-engine.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var root = document.getElementById("detail-root");
      var id = new URLSearchParams(location.search).get("id");
      var p = (window.SSENS_PROPERTIES || []).find(function (x) { return x.id === id; });
      if (!p || p.status === "hidden") {
        root.innerHTML = '<div class="empty" style="padding:120px 0"><h3>Không tìm thấy căn hộ</h3><p><a href="index.html" style="color:var(--tan-dark)">Quay lại tất cả căn hộ</a></p></div>';
        return;
      }
      var d = Object.assign({}, window.SSENS_DETAIL_DEFAULTS, (window.SSENS_PROPERTY_DETAILS || {})[p.id] || {}, p);
      document.title = p.name + " — S.Sens Homes";
      var isLongStay = p.rentalType === "long";
      var queryCheckin = new URLSearchParams(location.search).get("checkin");
      var queryCheckout = new URLSearchParams(location.search).get("checkout");
      var queryGuests = Number(new URLSearchParams(location.search).get("guests"));
      var rateFrom = isLongStay ? (p.monthlyFrom || p.priceMin * 30) : p.priceMin;
      function displayPrice(usd) { var vnd = Math.round(usd * ((window.SSENS_CONFIG && window.SSENS_CONFIG.vndPerUsd) || 25000)); return vnd.toLocaleString("vi-VN") + " ₫"; }
      var rateUnit = isLongStay ? "tháng" : "đêm";
      var stayLabel = isLongStay ? "Căn hộ dịch vụ dài hạn" : "Lưu trú dịch vụ ngắn hạn";
      var rateTable = isLongStay
        ? '<div class="rate-table"><div><span>Giá tháng tham khảo</span><b>từ ' + displayPrice(rateFrom) + ' / tháng</b></div><div><span>Thời hạn tối thiểu</span><b>' + (p.minimumTerm || '1 tháng') + '</b></div><div><span>Thanh toán</span><b>Trao đổi sau khi xác nhận</b></div></div>'
        : '<div class="rate-table"><div><span>Giá theo đêm</span><b>' + displayPrice(p.priceMin) + '–' + displayPrice(p.priceMax) + ' / đêm</b></div><div><span>Số đêm tối thiểu</span><b>' + (p.minNights || 1) + ' đêm</b></div><div><span>Thanh toán</span><b>Trao đổi sau khi xác nhận</b></div></div>';
      var longStayControls = isLongStay
        ? '<div class="row-2 long-stay-controls"><div class="field"><label>Loại căn hộ</label><select id="bk-unit-type"><option>Studio</option><option>1 phòng ngủ</option><option>2 phòng ngủ</option><option>Trao đổi theo nhu cầu</option></select></div><div class="field"><label>Thời hạn thuê</label><select id="bk-term"><option>1–3 tháng</option><option>3–6 tháng</option><option>Trên 6 tháng</option></select></div></div>'
        : '';

      var G = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 12a4 4 0 100-8 4 4 0 000 8z"/><path d="M4 20c0-3.3 3.6-5 8-5s8 1.7 8 5"/></svg>';
      var B = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 18V9a2 2 0 012-2h14a2 2 0 012 2v9"/><path d="M3 14h18M7 10h5"/><path d="M3 18v2M21 18v2"/></svg>';
      var T = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h16v3a4 4 0 01-4 4H8a4 4 0 01-4-4v-3z"/><path d="M6 12V6a2 2 0 012-2c1 0 1.6.5 2 1"/><path d="M9 5.5h2.5"/><path d="M7 19l-1 2M18 19l1 2"/></svg>';
      var S = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.8 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8L12 2z"/></svg>';

      var extra = p.images.length - 3;
      root.innerHTML =
        '<div class="detail-crumb"><a href="index.html">Căn hộ</a> · ' + p.location + ' · ' + p.name + '</div>' +
        '<div class="detail-head">' +
          '<div><h1>' + p.name + '</h1>' +
          '<div class="detail-meta">' +
            '<span class="card-rating">' + S + ' ' + p.rating.toFixed(2) + ' · ' + p.reviews + ' lượt ở</span>' +
            '<span>📍 ' + (d.address || p.location) + '</span>' +
          '</div></div>' +
        '</div>' +
        '<div class="gallery" id="gallery">' +
          '<figure class="g-main" data-idx="0"><img src="' + p.images[0] + '" alt="' + p.name + ' — photo 1" /></figure>' +
          '<div class="g-side">' +
            '<figure data-idx="1"><img src="' + (p.images[1] || p.images[0]) + '" alt="' + p.name + ' — photo 2" loading="lazy" /></figure>' +
            '<figure data-idx="2"><img src="' + (p.images[2] || p.images[0]) + '" alt="' + p.name + ' — photo 3" loading="lazy" />' +
              (extra > 0 ? '<div class="g-more">+' + extra + ' ảnh</div>' : '<div class="g-more" style="background:rgba(35,39,31,.25)">Xem toàn màn hình</div>') +
            '</figure>' +
          '</div>' +
        '</div>' +
        '<div class="detail-grid">' +
          '<div>' +
            '<div class="detail-section"><h3>Về căn hộ này</h3><p>' + p.description + '</p>' +
              '<p style="margin-top:12px">Được đội ngũ S.Sens chăm sóc, căn hộ đón tối đa ' + p.guests + ' khách, gồm ' + p.beds + ' giường và ' + p.baths + ' phòng tắm.</p></div>' +
            '<div class="detail-section"><h3>Tiện nghi</h3><ul class="amenities">' +
              d.amenities.map(function (a) { return '<li>' + a + '</li>'; }).join('') + '</ul></div>' +
            '<div class="detail-section"><h3>Quy định lưu trú</h3><ul class="rules">' +
              d.houseRules.map(function (r) { return '<li class="' + (/^Nhận phòng|^Trả phòng/.test(r) ? 'rule-time' : '') + '">' + r + '</li>'; }).join('') + '</ul></div>' +
            '<div class="detail-section"><h3>Chính sách hủy</h3><p>' + d.cancellation + '</p></div>' +
            '<div class="detail-section"><h3>Vị trí</h3><p style="margin-bottom:14px">📍 ' + (d.address || p.location) + '</p>' +
              '<div class="map-embed" style="margin-top:0;height:300px"><iframe title="Map — ' + p.name + '" loading="lazy" src="https://www.google.com/maps?q=' + encodeURIComponent(d.mapQuery || p.location + ' Vietnam') + '&output=embed"></iframe></div></div>' +
          '</div>' +
          '<aside class="detail-book"><div class="form-card bk-card">' +
            '<div class="stay-kind">' + stayLabel + '</div>' +
            '<div class="price-line"><b>từ ' + displayPrice(rateFrom) + '</b><span>/ ' + rateUnit + '</span></div>' +
            '<div style="font-size:13px;color:var(--muted);margin-bottom:14px">Đây là giá tham khảo. Chúng tôi sẽ xác nhận tình trạng căn và báo giá cuối cùng trước khi trao đổi thanh toán.</div>' +
            rateTable +
            longStayControls +
            '<div class="specs-line">' +
              '<span class="spec">' + G + ' ' + p.guests + ' khách</span>' +
              '<span class="spec">' + B + ' ' + p.beds + ' giường</span>' +
              '<span class="spec">' + T + ' ' + p.baths + ' phòng tắm</span>' +
            '</div>' +
            '<div class="bk-dates">' +
              '<div class="bk-field"><label>Ngày nhận phòng</label><output id="bk-in">Chọn ngày</output></div>' +
              '<div class="bk-field"><label>Ngày trả phòng</label><output id="bk-out">Chọn ngày</output></div>' +
            '</div>' +
            '<div id="bk-calendar"></div>' +
            '<div class="bk-guests"><span>' + G + ' Số khách' + (p.extraGuestFeeVnd ? '<small style="display:block;color:var(--muted);font-size:11px;font-weight:400">Gồm ' + (p.baseGuests || 2) + ' khách; thêm ' + Number(p.extraGuestFeeVnd).toLocaleString("vi-VN") + ' ₫/khách/đêm</small>' : '') + '</span>' +
              '<span class="ctrl" data-stepper="guests" data-min="1" data-max="' + p.guests + '">' +
                '<button type="button" data-dec>−</button><b>2</b><button type="button" data-inc>+</button>' +
            '</span></div>' +
            '<div id="bk-quote"><div class="bk-hint">Chọn ngày bạn mong muốn; chúng tôi sẽ xác nhận tình trạng trống và giá cuối cùng. Phản hồi trong 15 phút (8h–22h).</div></div>' +
            (p.status === "soldout" ? '<div class="bk-hint" style="text-align:center">Căn hộ hiện đã hết phòng. Vui lòng xem các căn khác hoặc liên hệ để được tư vấn.</div>' : '<button class="btn btn-primary btn-block" id="bk-request">Liên hệ về căn hộ này</button>') +
            '<a class="btn btn-zalo btn-block" id="bk-zalo" href="https://zalo.me/84832091997" target="_blank" rel="noopener">Nhắn Zalo</a>' +
            '<a class="btn btn-ghost btn-block" href="tel:+84832091997">Gọi ngay (+84) 83 209 1997</a>' +
            '<form id="bk-form" class="bk-form" novalidate>' +
              '<div class="field"><label>Họ và tên</label><input name="name" type="text" placeholder="Tên của bạn" required /><span class="err">Vui lòng nhập họ tên.</span></div>' +
              '<div class="field"><label>Email</label><input name="email" type="email" placeholder="you@email.com" required /><span class="err">Vui lòng nhập email hợp lệ.</span></div>' +
              '<div class="field"><label>Số điện thoại</label><input name="phone" type="tel" placeholder="+84 ..." required /><span class="err">Vui lòng nhập số điện thoại hợp lệ.</span></div>' +
              '<div class="field"><label>Ghi chú (không bắt buộc)</label><textarea name="note" placeholder="Bạn muốn chúng tôi lưu ý điều gì?"></textarea></div>' +
              '<button class="btn btn-primary btn-block" type="submit">Gửi yêu cầu</button>' +
              '<button class="btn btn-ghost btn-block" type="button" id="bk-cancel" style="margin-top:8px">Hủy</button>' +
            '</form>' +
          '</div></aside>' +
        '</div>';

      /* ---- Fullscreen lightbox ---- */
      var lb = document.getElementById("lightbox");
      var lbImg = document.getElementById("lightbox-img");
      var lbCount = document.getElementById("lightbox-count");
      var cur = 0;
      function show(i) {
        cur = (i + p.images.length) % p.images.length;
        lbImg.src = p.images[cur];
        lbCount.textContent = (cur + 1) + " / " + p.images.length;
      }
      function openLb(i) { show(i); lb.classList.add("open"); document.body.style.overflow = "hidden"; }
      function closeLb() { lb.classList.remove("open"); document.body.style.overflow = ""; }
      document.getElementById("gallery").addEventListener("click", function (e) {
        var f = e.target.closest("figure");
        if (f) openLb(+f.dataset.idx || 0);
      });
      lb.querySelector("[data-lb-close]").addEventListener("click", closeLb);
      lb.querySelector("[data-lb-prev]").addEventListener("click", function () { show(cur - 1); });
      lb.querySelector("[data-lb-next]").addEventListener("click", function () { show(cur + 1); });
      lb.addEventListener("click", function (e) { if (e.target === lb) closeLb(); });
      document.addEventListener("keydown", function (e) {
        if (!lb.classList.contains("open")) return;
        if (e.key === "Escape") closeLb();
        if (e.key === "ArrowLeft") show(cur - 1);
        if (e.key === "ArrowRight") show(cur + 1);
      });

      /* ---- Stay enquiry: dates and guest count are sent to the team ---- */
      var BK = (window.SSENS && window.SSENS.Booking) || null;
      if (BK) {
        var inOut = { ci: null, co: null };
        var elIn = document.getElementById("bk-in");
        var elOut = document.getElementById("bk-out");
        var elQuote = document.getElementById("bk-quote");
        var elForm = document.getElementById("bk-form");
        var elReq = document.getElementById("bk-request");
        var guests = queryGuests >= 1 && queryGuests <= p.guests ? queryGuests : 2;

        function currentPayload() {
          var q = BK.quote(p, inOut.ci, inOut.co, guests);
          return {
            property: p.name + (isLongStay && document.getElementById("bk-unit-type") ? " · " + document.getElementById("bk-unit-type").value + " · " + document.getElementById("bk-term").value : ""),
            checkin: inOut.ci ? BK.pretty(inOut.ci) : "",
            checkout: inOut.co ? BK.pretty(inOut.co) : "",
            nights: q.valid ? q.nights : "",
            guests: guests,
            total: q.valid ? BK.money(q.total) : ""
          };
        }
        function refresh() {
          var q = BK.quote(p, inOut.ci, inOut.co, guests);
          elIn.textContent = inOut.ci ? BK.pretty(inOut.ci) : "Chọn ngày";
          elOut.textContent = inOut.co ? BK.pretty(inOut.co) : "Chọn ngày";
          elQuote.innerHTML = isLongStay
            ? '<div class="bk-hint">' + (inOut.ci && inOut.co ? 'Ngày bạn chọn đã sẵn sàng để gửi. Chúng tôi sẽ xác nhận tình trạng căn và báo giá cuối cùng.' : 'Chọn ngày bạn mong muốn; chúng tôi sẽ xác nhận giá cuối cùng.') + '</div>'
            : BK.quoteHTML(q);
        }

        function initCalendar(ranges) {
          var unavailableDates = [];
          (ranges || []).forEach(function (range) {
            var start = new Date(range.checkin + "T00:00:00");
            var end = new Date(range.checkout + "T00:00:00");
            for (var day = start; day < end; day.setDate(day.getDate() + 1)) unavailableDates.push(BK.iso(day));
          });
          BK.Calendar(document.getElementById("bk-calendar"), {
            minDate: BK.today(),
            initialCheckin: queryCheckin ? new Date(queryCheckin + "T00:00:00") : null,
            initialCheckout: queryCheckout ? new Date(queryCheckout + "T00:00:00") : null,
            unavailableDates: unavailableDates,
            onChange: function (ci, co) { inOut.ci = ci; inOut.co = co; refresh(); },
            onUnavailableRange: function () { window.SSENS.toast && window.SSENS.toast("Khoảng ngày này trùng với ngày không còn trống. Vui lòng chọn khoảng khác."); }
          });
        }
        initCalendar([]);

        // guests stepper
        (function () {
          var st = document.querySelector('[data-stepper="guests"]');
          var min = +st.dataset.min, max = +st.dataset.max;
          var out = st.querySelector("b");
          if (guests > max) guests = max;
          out.textContent = guests;
          var dec = st.querySelector("[data-dec]"), inc = st.querySelector("[data-inc]");
          function sync() { out.textContent = guests; dec.disabled = guests <= min; inc.disabled = guests >= max; }
          dec.addEventListener("click", function () { guests = Math.max(min, guests - 1); sync(); });
          inc.addEventListener("click", function () { guests = Math.min(max, guests + 1); sync(); });
          sync();
        })();

        // Contact form -> reveal after dates are selected
        if (!elReq) return;
        elReq.addEventListener("click", function () {
          if (!inOut.ci || !inOut.co) {
            window.SSENS.toast && window.SSENS.toast("Vui lòng chọn ngày nhận và trả phòng trước.");
            document.getElementById("bk-calendar").scrollIntoView({ behavior: "smooth", block: "center" });
            return;
          }
          elForm.classList.add("show");
          elReq.style.display = "none";
          elForm.querySelector("input[name=name]").focus();
        });
        document.getElementById("bk-cancel").addEventListener("click", function () {
          elForm.classList.remove("show");
          elReq.style.display = "";
        });

        elForm.addEventListener("submit", function (e) {
          e.preventDefault();
          var f = elForm.elements; // use .elements to avoid the form.name collision (name shadows the input)
          var emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          var phoneRe = /^[+()\d][\d\s().-]{6,}$/;
          var checks = [
            [f.name, f.name.value.trim().length >= 2],
            [f.email, emailRe.test(f.email.value.trim())],
            [f.phone, phoneRe.test(f.phone.value.trim())]
          ];
          var ok = true;
          checks.forEach(function (c) { c[0].closest(".field").classList.toggle("invalid", !c[1]); if (!c[1]) ok = false; });
          if (!ok) return;

          var payload = currentPayload();
          payload.stayType = isLongStay ? "long" : "short";
          payload.channel = "website";
          payload.checkin = BK.iso(inOut.ci);
          payload.checkout = BK.iso(inOut.co);
          payload.name = f.name.value.trim();
          payload.email = f.email.value.trim();
          payload.phone = f.phone.value.trim();
          payload.note = f.note ? f.note.value.trim() : "";
          payload.estimate = payload.total;

          var btn = elForm.querySelector('button[type="submit"]');
          btn.textContent = "Đang chuẩn bị yêu cầu..."; btn.disabled = true;
          fetch("/api/leads", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }).then(function (response) {
            return response.json().then(function (data) { if (!response.ok) throw new Error(data.error || "Chưa thể gửi yêu cầu."); return data; });
          }).then(function (result) {
            var aside = document.querySelector(".detail-book .form-card");
            aside.innerHTML =
              '<div class="bk-done"><div class="bk-done-ico">✓</div>' +
              '<h3>Đã nhận yêu cầu của bạn</h3>' +
              '<p>' + result.lead.responsePromise + '. Đội ngũ S.Sens sẽ liên hệ để xác nhận tình trạng căn và báo giá cuối cùng.</p>' +
              '<div class="bk-done-sum">' +
                '<div><span>' + payload.checkin + ' → ' + payload.checkout + '</span></div>' +
                '<div><span>' + payload.nights + ' đêm · ' + payload.guests + ' khách</span></div>' +
                '<div><b>Mã yêu cầu: ' + result.lead.reference + '</b></div>' +
              '</div>' +
              '<a class="btn btn-ghost btn-block" href="index.html#listing" style="margin-top:16px">Xem thêm căn hộ</a></div>';
            window.SSENS.toast && window.SSENS.toast("Yêu cầu đã sẵn sàng để gửi!");
          }).catch(function (error) {
            btn.textContent = "Gửi yêu cầu"; btn.disabled = false;
            window.SSENS.toast && window.SSENS.toast(error.message || "Chưa thể chuẩn bị yêu cầu. Vui lòng thử lại.");
          });
        });

        refresh();
      }
    });
  </script>
</body>
</html>
