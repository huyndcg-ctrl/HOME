services:
  - type: web
    name: ssens-homes-demo
    runtime: node
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /index.html
    envVars:
      - key: ADMIN_AUTH_DISABLED
        value: "true"
      - key: ALLOW_UNVERIFIED_SIGNUP
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ASSET_FALLBACK_BASE
        value: https://raw.githubusercontent.com/huyndcg-ctrl/HOME/main
      - key: OWNER_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
